name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two Pythons on Linux: the declared floor (pyproject.toml's
  # requires-python) and whatever is current — the day 3.9 breaks here is
  # the day dropping it becomes a decision instead of an accident.
  linux:
    name: linux-py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev

      # REQUIRE_BACKENDS turns a silently skipped backend into a configure
      # error. The install prefix is passed at configure time because
      # pathime.pc bakes in absolute paths.
      - name: Configure libpathime
        run: >
          cmake -S libpathime -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist
          -DLIBPATHIME_REQUIRE_BACKENDS=ON

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        env:
          PATHIME_LIBRARY: ${{ github.workspace }}/dist/lib/libpathime.so
        run: |
          python -m pip install pytest
          python -m pytest -v

  # The thing users install, not the checkout: build the sdist, build the
  # wheel FROM the sdist (python -m build's default, which is what catches a
  # MANIFEST gap), twine-check both, install the wheel into a clean venv and
  # run the whole suite against it. On the floor Python, where packaging
  # metadata fails first.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev

      - name: Configure libpathime
        run: >
          cmake -S libpathime -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist
          -DLIBPATHIME_REQUIRE_BACKENDS=ON

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel in a clean venv and test it
        env:
          PATHIME_LIBRARY: ${{ github.workspace }}/dist/lib/libpathime.so
          PATHIME_TEST_INSTALLED: "1"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl pytest
          /tmp/clean/bin/python -c 'import pathime; print(pathime.__file__)' \
            | grep site-packages
          /tmp/clean/bin/python -m pytest -v

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # The codegen tools run with the CRT in binary mode; a CRLF checkout
      # leaves stray CRs in parsed dictionary tokens (BUILD.md).
      - name: Checkout with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The image's own CMake rolls with the fleet; 4.2.3 is new enough to
      # find Visual Studio on the windows-2025 image. Same pin as libpathime's
      # own CI.
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: 4.2.3

      - name: Resolve vcpkg baseline
        id: vcpkg
        run: echo "rev=$(git -C C:\vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      # restore/save rather than the combined action: the combined form saves
      # only when the whole job succeeds, so a failure after `vcpkg install`
      # throws away a from-source glib build (~25 minutes). The exact-rev key
      # rarely repeats across image rolls; the prefix fallback restores the
      # newest previous tree and `vcpkg install` becomes a near-no-op.
      - name: Restore vcpkg installed tree
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-2025-${{ steps.vcpkg.outputs.rev }}
          restore-keys: vcpkg-windows-2025-

      - name: Install pyzy's dependencies
        run: vcpkg install glib:x64-windows sqlite3:x64-windows pkgconf:x64-windows

      - name: Save vcpkg installed tree
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-2025-${{ steps.vcpkg.outputs.rev }}

      # The windows-ninja preset runs from a developer prompt; the msvc preset
      # would need the windows-2022 image — its Visual Studio 17 generator
      # finds nothing on the 2025 image, which ships only Visual Studio 18.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # VCPKG_ROOT on the steps, not the job: vcvars points it at the vcpkg
      # bundled with Visual Studio, and the preset reads it. The link pool
      # serializes link steps only — vcpkg's applocal step copies the same
      # runtime DLLs beside every executable, and two concurrent copies of
      # the same DLL collide.
      - name: Configure libpathime
        working-directory: libpathime
        env:
          VCPKG_ROOT: C:\vcpkg
        run: >-
          cmake --preset windows-ninja
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\dist
          -DLIBPATHIME_REQUIRE_BACKENDS=ON
          -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link

      - name: Build
        working-directory: libpathime
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cmake --build --preset windows-ninja

      - name: Install
        run: cmake --install libpathime\build\windows-ninja

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Test
        env:
          PATHIME_LIBRARY: ${{ github.workspace }}\dist\bin\pathime.dll
        run: |
          python -m pip install pytest
          python -m pytest -v
