name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches project version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      # The binding is pure Python; the shared library comes from the
      # matching libpathime release. The draft is published by hand after
      # a look at the assets.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "pathime $v" \
            --notes "Python binding for libpathime. Install the wheel, then point PATHIME_LIBRARY at a library from the matching libpathime release: https://github.com/bjj/libpathime/releases/tag/$GITHUB_REF_NAME" \
            dist/*
