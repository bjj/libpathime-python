name: Release

# Version-shaped tags only, mirroring libpathime's own release workflow. The
# package job proves the artifacts (tag ↔ pyproject ↔ submodule pin agree;
# the wheel is installed into a clean venv and the whole suite runs against
# it), attests provenance, and drafts the GitHub release — publishing the
# draft stays a human act. The PyPI push waits separately behind the `pypi`
# environment (Trusted Publishing; the environment's required reviewer is
# the gate), because PyPI, like NuGet, does not really take things back.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Check tag matches project version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME"

      # The releases move in lockstep (libpathime's RELEASING.md): the notes
      # below point at libpathime's release of the same tag, so fail if the
      # submodule is pinned anywhere else.
      - name: Check submodule pin matches the tag
        run: |
          pin=$(git rev-parse HEAD:libpathime)
          git -C libpathime fetch --depth 1 origin tag "$GITHUB_REF_NAME"
          want=$(git -C libpathime rev-parse "$GITHUB_REF_NAME^{commit}")
          if [ "$pin" != "$want" ]; then
            echo "submodule pinned at $pin but libpathime $GITHUB_REF_NAME is $want"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev uuid-dev

      - name: Build libpathime
        run: |
          cmake -S libpathime -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist-native" \
            -DLIBPATHIME_REQUIRE_BACKENDS=ON
          cmake --build build
          cmake --install build

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel in a clean venv and test it
        env:
          PATHIME_LIBRARY: ${{ github.workspace }}/dist-native/lib/libpathime.so
          PATHIME_TEST_INSTALLED: "1"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl pytest
          /tmp/clean/bin/python -c 'import pathime; print(pathime.__file__)' \
            | grep site-packages
          /tmp/clean/bin/python -m pytest -v

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "pathime $v" \
            --notes "Python binding for libpathime — also on PyPI (\`pip install pathime\`). The wheel needs a shared library from the matching libpathime release: https://github.com/bjj/libpathime/releases/tag/$GITHUB_REF_NAME" \
            dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # Trusted Publishing: no token, just this repo+workflow+environment
  # registered as the publisher on pypi.org. The environment's required
  # reviewer is the approval step — approve after reviewing the draft.
  pypi:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
